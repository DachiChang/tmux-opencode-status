# A maintainer triggers this workflow by pushing a v<VERSION> tag.
# It verifies the tag against VERSION, runs tests, builds for both macOS
# architectures, and publishes a GitHub release with two .tar.gz files and
# SHA256SUMS. The TPM entry script uses VERSION to find the assets under
# releases/download/v<VERSION>/.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify the tag matches VERSION
        run: |
          [ "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION" >&2; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build and package release assets
        run: scripts/build-release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
