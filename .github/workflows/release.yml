# 發布流程（尚未啟用：此檔只是備妥；推 tag 屬外部動作，需維護者明確執行）。
# 推 v<VERSION> tag 時：驗證 tag 與 VERSION 檔一致 → 跑測試 → 建置兩種 macOS 架構 → 建立 GitHub Release 並附上
# 兩個 .tar.gz 與 SHA256SUMS。TPM 入口腳本依 VERSION 檔取得 releases/download/v<VERSION>/ 下的資產。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tag 必須與 VERSION 檔一致
        run: |
          [ "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME 與 VERSION 不符" >&2; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: 建置與封裝
        run: scripts/build-release.sh
      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
